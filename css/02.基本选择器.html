<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>基本选择器</title>
    <style>
      h3 {
        color: red;
      }
      #author {
        color: blue;
      }
      .c {
        color: green;
      }
      p,
      div,
      a {
        background-color: rgb(254, 111, 1);
      }
    </style>
  </head>
  <body>
    <h3>悯农</h3>
    <h4 id="author">唐 李绅</h4>
    <p>锄禾日当午</p>
    <p>汗滴禾下土</p>
    <p>谁知盘中餐</p>
    <p class="c">粒粒皆辛苦</p>
    <div class="c">你苦,我苦,大家苦</div>
    <a
      class="c"
      href="https://baike.baidu.com/item/%E5%90%B4%E4%BA%A6%E5%87%A1/8325774"
      >他最苦</a
    >
  </body>
</html>
