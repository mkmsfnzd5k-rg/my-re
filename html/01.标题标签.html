<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>标题标签</title>
    <style>
      ul li {
        list-style: none;
        float: left;
      }
    </style>
  </head>
  <body>
    <!-- 标题标签 -->
    <h1>一级标题</h1>
    <h2>二级标题</h2>
    <h3>三级标题</h3>
    <h4>四级标题</h4>
    <h5>五级标题</h5>
    <h6>六级标题</h6>
    <!-- 段落标签 -->
    <p>窗前明月光，</p>
    <p>疑是地上霜。</p>
    <!-- 换行标签 -->
    <p>
      举头望明月，<br />
      低头思故乡。
    </p>
    <!-- div标签 -->
    <div>我在div标签中</div>
    虽然我在div标签后面,但是我会在下一行显示<br />
    <!-- 转义字符(实体) -->
    10&gt;5,10&lt;20,版权符号:&copy;2026,我可以&nbsp;&nbsp;&nbsp;&nbsp;一定行,注册商标&reg;
    <!-- 无序列表 -->
    <ul>
      <li><a href="#">网页</a>|</li>
      <li><a href="#">地图</a>|</li>
      <li><a href="#">贴吧</a>|</li>
      <li><a href="#">音乐</a></li>
    </ul>
    <br />
    <!-- 有序列表 -->
    <ol type="I">
      <li>网页</li>
      <li>地图</li>
      <li>贴吧</li>
      <li>音乐</li>
    </ol>
  </body>
</html>
