<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表单</title>
  </head>
  <body>
    <form action="success.html" method="post">
      用户名:<input type="text" name="username" /> <br />
      密码: <input type="password" name="password" /><br />
      性别: <input type="radio" name="gender" value="man" selected />男
      <input type="radio" name="gender" value="woman" />女<br />
      爱好: <input type="checkbox" name="hobby" value="sing" />唱歌
      <input type="checkbox" name="hobby" value="dance" />跳舞
      <input type="checkbox" name="hobby" value="rap" selected />rap
      <input type="checkbox" name="hobby" value="basketball" />篮球<br />
      喜欢的动漫男主角:
      <select name="actor">
        <option>王林</option>
        <option selected>叶凡</option>
        <option>石昊</option>
        <option>许青</option>
        <option>秦牧</option>
      </select>
      <br />
      个人简介:<textarea name="introduce"></textarea>
      <input type="reset" value="重置" />
      <input type="submit" value="注册" />
    </form>
  </body>
</html>
